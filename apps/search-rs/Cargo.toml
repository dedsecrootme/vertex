[package]
name = "search-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2" }
serde = { version = "1", features = ["derive"] }
crawler-rs = { path = "../crawler-rs" }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
