[package]
name = "api-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
search-rs = { path = "../search-rs" }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }