[package]
name = "hub-rs"
version = "0.1.0"
edition = "2024"

# vx-hub : service communautaire Vertex (chat, forums, avis, partenaires).
#
# Dépendances volontairement réduites au minimum :
#  - rusqlite : stockage (sera remplacé par vx-store, « maison », à terme) ;
#  - sha2/pbkdf2/subtle : derivation et verification maintenues ;
#  - serde/serde_json : sérialisation JSON.
# Aucune dépendance réseau : le serveur HTTP est écrit à la main (http.rs) et
# l'alea cryptographique utilise getrandom (generateur du systeme).
[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
pbkdf2 = "0.12"
subtle = "2"
url = "2"
