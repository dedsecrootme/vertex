<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex — Recherche</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="reader.css">
<script src="app.js" defer></script>
</head>
<body data-mode="loading">
<header class="hero">
  <div class="brandbar"><h1 class="logo"><span class="brandmark" aria-hidden="true">V</span>Vertex</h1><span class="index-mode" id="indexMode">Index personnel</span></div>
  <p class="search-label">Rechercher le web indexé</p>
  <form class="search" id="searchForm">
    <input id="q" type="search" aria-label="Rechercher dans l'index" maxlength="256" placeholder="Rechercher un sujet, un site, un lien…" autofocus>
    <button type="submit" aria-label="Rechercher" title="Rechercher"><svg class="icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg></button>
  </form>
  <div class="chips" id="chips"><button type="button" class="chip" data-q="rust">Rust</button><button type="button" class="chip" data-q="performance">Performance</button><button type="button" class="chip" data-q="python">Python</button><button type="button" class="chip" data-q="sécurité">Sécurité</button><button type="button" class="chip" data-q="wikipedia">Wikipédia</button></div>
</header>
<main>
  <p id="errorBanner" class="danger-note" role="alert" hidden></p>
  <div class="toolbar" id="toolbar">
    <strong data-local>Moteur</strong><button type="button" class="btn primary" id="crawlBtn" data-local>Crawler le web</button>
    <select id="durSel" data-local aria-label="Duree du crawl"><option value="600">10 min</option><option value="1800">30 min</option><option value="7200" selected>2 h</option><option value="36000">10 h</option></select>
    <a href="/panel" class="btn ghost" id="monitorLink" data-local title="Supervision du crawler"><svg class="icon" aria-hidden="true"><use href="/icons.svg#activity"></use></svg>Supervision</a><span class="spacer"></span><span class="meta" id="statsBar">—</span>
  </div>
  <div class="contribution" id="contributionSettings" hidden>
    <label><input type="checkbox" id="contributionToggle"> Explorer sur ce PC</label><label><input type="checkbox" id="backgroundToggle"> Continuer après fermeture</label><label><input type="checkbox" id="shareToggle"> Proposer les URL publiques</label><span class="meta" id="contributionState" role="status"></span>
  </div>
  <div class="tabs" role="tablist" aria-label="Vues"><button type="button" class="tab active" data-tab="results">Résultats</button><button type="button" class="tab" data-tab="bookmarks">Signets <span id="bmCount"></span></button><button type="button" class="tab" data-tab="contact">Contact admin</button><button type="button" class="tab" data-tab="inbox" data-local>Messages <span id="msgCount"></span></button></div>
  <section id="panel-results"><div id="meta" class="meta" role="status" aria-live="polite"></div><div id="results"></div><button type="button" id="more" class="btn ghost more" style="display:none">Charger plus</button></section>
  <section id="panel-bookmarks" style="display:none"><h2>Vos signets</h2><div id="bookmarkList"></div></section>
  <section id="panel-contact" style="display:none">
    <form id="contactForm"><h2>Contacter l'administrateur</h2>
      <div class="field"><label for="cName">Nom (optionnel)</label><input type="text" id="cName" maxlength="200" autocomplete="name"></div>
      <div class="field"><label for="cEmail">Email (optionnel)</label><input id="cEmail" maxlength="320" type="email" autocomplete="email"></div>
      <div class="field"><label for="cSubject">Sujet</label><input type="text" id="cSubject" maxlength="300" placeholder="Ex : suggestion de site"></div>
      <div class="field"><label for="cMessage">Message *</label><textarea id="cMessage" maxlength="8000" required rows="5" placeholder="Votre message…"></textarea></div>
      <button class="btn primary" id="contactSend" type="submit">Envoyer</button><span class="meta" id="contactState" role="status" aria-live="polite"></span>
    </form>
  </section>
  <section id="panel-inbox" style="display:none"><h2>Messages reçus</h2><div id="inboxList"></div></section>
</main>
<footer id="privacyNote">Vertex · index personnel · les sites contactés voient votre adresse IP</footer>
<div id="view"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="reader-toolbar"><button type="button" id="closeView" class="reader-back" aria-label="Fermer la lecture" title="Retour aux résultats"><svg class="icon" aria-hidden="true"><use href="/icons.svg#arrow-left"></use></svg><span>Résultats</span></button><a class="reader-brand" href="/">Vertex</a><div class="reader-tools"><button type="button" id="readerSmaller" title="Réduire le texte" aria-label="Réduire le texte"><svg class="icon" aria-hidden="true"><use href="/icons.svg#minus"></use></svg></button><span aria-hidden="true">Aa</span><button type="button" id="readerLarger" title="Agrandir le texte" aria-label="Agrandir le texte"><svg class="icon" aria-hidden="true"><use href="/icons.svg#plus"></use></svg></button></div><progress id="readingProgress" value="0" max="100" aria-label="Progression de lecture"></progress></div>
  <div class="reader-document"><div class="reader-source"><div class="fav" id="vFav"></div><a class="url" id="vUrl" href="#" target="_blank" rel="noopener noreferrer">Page source</a></div><h1 id="vTitle">Lecture</h1>
  <div class="reader-meta"><span class="badge" id="vSafety"></span><span id="vReading"></span><span class="meta" id="vMeta"></span></div><div id="vNotice"></div><article id="vBody" aria-busy="false"></article>
  <details class="documented"><summary class="meta">Liens complets &amp; images documentés (<span id="vCounts"></span>)</summary><div id="vLinks" class="meta mono"></div></details>
</div></div></div>
</body>
</html>
