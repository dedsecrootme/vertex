[package]
name = "crawler-rs"
version = "0.13.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.27"
url = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "time"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
ammonia = "4.2.3"
roxmltree = "0.20"
httpdate = "1"
