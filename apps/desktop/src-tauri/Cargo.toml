[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
search-rs = { path = "../../search-rs" }
crawler-rs = { path = "../../crawler-rs" }

[workspace]
resolver = "2"
[profile.release]
opt-level = 2
codegen-units = 16
panic = "unwind"
lto = false
debug = false
